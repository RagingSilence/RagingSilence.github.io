<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if not .IsHome }}{{ .Title }} · {{ end }}{{ .Site.Title }}</title>
  <meta name="description" content="{{ .Description | default .Site.Params.description }}">
  <link rel="canonical" href="{{ .Permalink }}">
  <link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
  {{ with .OutputFormats.Get "rss" }}<link rel="alternate" type="application/rss+xml" title="{{ $.Site.Title }}" href="{{ .Permalink }}">{{ end }}
  <script defer src="{{ "js/site.js" | relURL }}"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到正文</a>
  <header class="site-header"><div class="header-inner">
    <a class="brand" href="{{ .Site.Home.RelPermalink }}"><span class="brand-mark" aria-hidden="true">札</span><span>{{ .Site.Title }}</span></a>
    <nav aria-label="主导航">
      <a href="{{ .Site.Home.RelPermalink }}" {{ if .IsHome }}aria-current="page"{{ end }}>首页</a>
      <a href="{{ "posts/" | relURL }}" {{ if eq .Section "posts" }}aria-current="page"{{ end }}>文章</a>
      <a href="{{ "categories/" | relURL }}" {{ if eq .Section "categories" }}aria-current="page"{{ end }}>分类</a>
      <a href="{{ "tags/" | relURL }}" {{ if eq .Section "tags" }}aria-current="page"{{ end }}>标签</a>
      <a href="{{ "about/" | relURL }}" {{ if eq .RelPermalink ("about/" | relURL) }}aria-current="page"{{ end }}>关于</a>
    </nav>
  </div></header>
  <main id="main" class="site-main">{{ block "main" . }}{{ end }}</main>
  <footer class="site-footer"><span>© {{ now.Year }} {{ .Site.Params.author }}</span><div><a href="https://github.com/RagingSilence" rel="me">GitHub ↗</a><a href="{{ "index.xml" | relURL }}">RSS ↗</a></div></footer>
</body>
</html>
